    <a href="#" onclick="openSignup()">Sign Up</a>
  </div>
</nav>

<!-- HEADER -->
<header>
  <h1>PACKAGES</h1>
  <h2>Explore our travel plans</h2>
</header>

<!-- MAIN -->
<main>

  <div id="packagesContainer"></div>

</main>

<!-- FOOTER -->
<footer class="footer" id="contact">
  <div class="footer-container">

    <div class="footer-section">
      <h3>Troops Travels</h3>
      <p>Your journey, our priority.</p>
    </div>

    <div class="footer-section">
      <h3>Quick Links</h3>
      <p><a href="homepage.html">Home</a></p>
      <p><a href="packages.html">Packages</a></p>
      <p><a href="booking.html">Booking</a></p>
      <p><a href="gallery.html">Gallery</a></p>
    </div>

    </div>

  </div>

  </div>

<!-- MODALS -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="signupModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>Sign Up</h2>
    <input id="signupName" placeholder="Name">
    <input id="signupEmail" placeholder="Email">
    <input id="signupPassword" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
  </div>
</div>

<script src="main.js"></script>
<script src="script.js"></script>

</body>
</html>
